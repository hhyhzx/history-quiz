<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日打卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f0eb;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.cards{display:flex;flex-direction:column;gap:20px;width:100%;max-width:360px}
.card{display:flex;align-items:center;gap:16px;padding:24px 20px;border-radius:18px;text-decoration:none;color:#fff;font-size:18px;font-weight:700;transition:.2s;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.card:active{transform:scale(.96)}
.card-history{background:linear-gradient(135deg,#8b4513,#a0522d)}
.card-daofa{background:linear-gradient(135deg,#1a5276,#2980b9)}
.card .icon{font-size:40px}
.card .desc{font-weight:400;font-size:12px;opacity:.85;margin-top:4px}
</style>
</head>
<body>
<div class="cards">
<a class="card card-history" href="./打卡练习_历史选择题.html">
  <span class="icon">📜</span>
  <div><div>历史选择题 · 每日打卡</div><div class="desc">武汉市八年级历史下册真题汇编 · 138题</div></div>
</a>
<a class="card card-daofa" href="./打卡练习_道法选择题.html">
  <span class="icon">⚖️</span>
  <div><div>道法选择题 · 每日打卡</div><div class="desc">武汉市八年级道法下册真题汇编 · 79题</div></div>
</a>
</div>
</body>
</html>
