<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>历史选择题 · 每日打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="历史打卡">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8b4513">
<style>
:root{--bg:#f5f0eb;--card:#fff;--primary:#8b4513;--green:#2d8b2d;--red:#c0392b;--gold:#d4a017;--gray:#999;--tag:#e8d5b7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:8px}
.app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column}

/* Pages */
.page{display:none;flex:1;flex-direction:column}
.page.active{display:flex}

/* Home */
.home{justify-content:center;align-items:center;text-align:center;padding:30px 20px}
.home h1{font-size:26px;color:var(--primary);margin-bottom:6px}
.home .sub{font-size:13px;color:var(--gray);margin-bottom:24px}
.stat-row{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border-radius:14px;padding:16px 14px;min-width:80px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:11px;color:var(--gray);margin-top:2px}
.btn{display:inline-block;padding:14px 40px;border-radius:30px;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(139,69,19,.3)}
.btn-primary:active{transform:scale(.96)}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-sm{padding:10px 24px;font-size:14px;border-radius:22px}
.progress-bar{height:3px;background:#e0d5c5;border-radius:2px;margin-bottom:14px}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:.3s}

/* Quiz */
.quiz-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid #eee}
.quiz-header .qnum{font-size:13px;color:var(--gray)}
.quiz-header .topic{font-size:11px;color:var(--gold);background:var(--tag);padding:3px 10px;border-radius:10px}
.quiz-body{flex:1;overflow-y:auto;padding:16px}
.stem{font-size:15px;line-height:1.7;color:#333;margin-bottom:16px;padding:14px;background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;padding:13px 14px;background:var(--card);border-radius:12px;border:2px solid #e8e0d5;cursor:pointer;transition:.2s;font-size:14px;line-height:1.5}
.opt:active{transform:scale(.98)}
.opt.correct{border-color:var(--green);background:#eaf7ea}
.opt.wrong{border-color:var(--red);background:#fdeaea}
.opt.show-correct{border-color:var(--green);background:#eaf7ea}
.opt .letter{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#f0ebe0;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-right:10px;flex-shrink:0}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt.show-correct .letter{background:var(--green);color:#fff}
.explanation{margin-top:12px;padding:12px;background:#fffdf5;border-radius:10px;border:1px solid #eed;font-size:13px;color:#666;display:none}
.explanation.show{display:block}

/* Next button - inline after explanation */
.quiz-next-btn{display:block;width:100%;margin-top:14px;padding:14px;
  background:var(--primary);color:#fff;border:none;border-radius:14px;
  font-size:17px;font-weight:700;cursor:pointer;text-align:center;
  box-shadow:0 3px 12px rgba(139,69,19,.35);transition:.2s}
.quiz-next-btn:active{transform:scale(.97)}

/* Result */
.result{justify-content:center;align-items:center;text-align:center;padding:30px 20px}
.result .big-num{font-size:60px;font-weight:800;color:var(--primary)}
.result .big-lbl{font-size:14px;color:var(--gray);margin-bottom:16px}
.result .detail{font-size:13px;color:#555;line-height:2}
.wrong-list{text-align:left;margin-top:16px;max-height:40vh;overflow-y:auto}
.wrong-list .item{font-size:12px;padding:8px;margin:4px 0;background:#fff5f5;border-radius:8px;border-left:3px solid var(--red)}

/* Correction book */
.correction-header{display:flex;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid #eee;gap:12px}
.correction-header .back{font-size:24px;cursor:pointer;color:var(--primary)}
.correction-list{flex:1;overflow-y:auto;padding:12px}
.correction-item{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.correction-item .meta{font-size:11px;color:var(--gold);margin-bottom:6px}
.correction-item .q{font-size:13px;line-height:1.6;margin-bottom:8px}
.correction-item .my{font-size:12px;color:var(--red)}
.correction-item .right{font-size:12px;color:var(--green)}

.empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* Confetti */
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.pop{animation:pop .4s ease-out}

/* Streak fire */
.streak-row{display:flex;gap:4px;justify-content:center;margin-bottom:12px}
.streak-dot{width:8px;height:8px;border-radius:50%;background:#e0d5c5}
.streak-dot.done{background:var(--primary)}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <div class="home">
      <h1>历史选择题 · 每日打卡</h1>
      <div class="sub">武汉市八年级历史下册真题汇编</div>
      <div class="stat-row">
        <div class="stat-card">
          <div class="num" id="stat-streak">0</div>
          <div class="lbl">连续打卡(天)</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-total">0</div>
          <div class="lbl">累计做题</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-rate">-</div>
          <div class="lbl">正确率</div>
        </div>
      </div>
      <div class="streak-row" id="streak-row"></div>
      <div id="overall-progress"></div>
      <div style="margin-bottom:16px">
        <button class="btn btn-primary" onclick="startQuiz()">开始刷题 (10题/轮)</button>
      </div>
      <div>
        <button class="btn btn-outline btn-sm" onclick="showCorrection()">纠错本 (<span id="corr-count">0</span>)</button>
        <button class="btn btn-outline btn-sm" style="margin-left:8px" onclick="resetData()">重置数据</button>
      </div>
    </div>
  </div>

  <!-- QUIZ PAGE -->
  <div class="page" id="page-quiz">
    <div class="quiz-header">
      <span class="qnum" id="quiz-progress"></span>
      <span class="topic" id="quiz-topic"></span>
    </div>
    <div style="padding:0 16px">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="quiz-body" id="quiz-body">
      <div class="stem" id="quiz-stem"></div>
      <div class="options" id="quiz-options"></div>
      <div class="explanation" id="quiz-explanation"></div>
      <div id="quiz-next-wrap"></div>
    </div>
  </div>

  <!-- RESULT PAGE -->
  <div class="page" id="page-result">
    <div class="result">
      <div class="big-num" id="result-score"></div>
      <div class="big-lbl" id="result-msg"></div>
      <div class="detail" id="result-detail"></div>
      <div class="wrong-list" id="wrong-list"></div>
      <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary btn-sm" onclick="continueQuiz()">继续刷10题</button>
        <button class="btn btn-outline btn-sm" onclick="goHome()">返回首页</button>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--gray)">每天可刷多轮，14天完成全部138题</div>
    </div>
  </div>

  <!-- CORRECTION PAGE -->
  <div class="page" id="page-correction">
    <div class="correction-header">
      <span class="back" onclick="goHome()">←</span>
      <span style="font-weight:700;color:var(--primary)">纠错本</span>
      <span style="font-size:12px;color:var(--gray);margin-left:auto" id="corr-total">共0题</span>
    </div>
    <div class="correction-list" id="correction-list"></div>
  </div>
</div>

<script>

{"u":"第一单元","t":"1-2","s":"黄炎培在1949年10月1日的日记中写道：民众游行、广场狂欢……余亦参加。黄炎培参加的应是（ ）","a":"中国人民政治协商会议第一届全体会议","b":"开国大典","c":"第一届全国人民代表大会","d":"中国共产党第八次全国代表大会","x":"B"},

// ========== STATE ==========
const STORAGE_KEY = 'history_quiz_data';
const DAILY_COUNT = 10;
const Q_PER_PAGE = 1;
const TOTAL_QUESTIONS = Q.length;

// Ensure Q is sorted by unit→topic order
const UNIT_ORDER = ['第一单元','第二单元','第三单元','第四单元','第五单元','第六单元','第七单元','第八单元'];
Q.sort((a,b)=>{
  const ua = UNIT_ORDER.indexOf(a.u), ub = UNIT_ORDER.indexOf(b.u);
  if(ua!==ub) return ua-ub;
  return (a.t||'').localeCompare(b.t||'');
});

function loadData(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}
}
function saveData(d){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

let appState = {
  questions: [],
  currentIdx: 0,
  answers: [],
  revealed: [],
  mode: 'home',
};

// ========== NAVIGATION ==========
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page = document.getElementById('page-'+name);
  if(page) page.classList.add('active');
  appState.mode = name;
  window.scrollTo(0,0);
}

function goHome(){
  showPage('home');
  updateHomeStats();
}

// ========== QUESTION PICKING (sequential by unit/topic) ==========
function getProgressIndex(){
  const data = loadData();
  return data.progressIndex || 0;
}
function setProgressIndex(idx){
  const data = loadData();
  data.progressIndex = idx % TOTAL_QUESTIONS;
  saveData(data);
}

function pickDailyQuestions(){
  const start = getProgressIndex();
  const indices = [];
  for(let i=0;i<DAILY_COUNT;i++){
    indices.push((start+i) % TOTAL_QUESTIONS);
  }
  return indices;
}

// ========== SAVE & PROGRESS ==========
function getDailySeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function dayKeyFromDate(d){
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function recalcStreak(data){
  // Count consecutive "done" days counting backwards from today
  const days = data.days||{};
  let streak = 0;
  const today = new Date();
  for(let i=0;i<365;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = dayKeyFromDate(d);
    if(days[key] && days[key].done) streak++;
    else break;
  }
  return streak;
}
function findEarliestUnfilledDay(data){
  // Find the earliest past day (up to 30 days back) that hasn't been filled
  const days = data.days||{};
  const today = new Date();
  for(let i=1;i<=30;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = dayKeyFromDate(d);
    if(!days[key] || !days[key].done) return key;
  }
  return null; // All recent days filled
}
function updateHomeStats(){
  const data = loadData();
  const totalDone = (data.totalDone||0);
  const totalCorrect = (data.totalCorrect||0);
  const correction = data.correction||[];
  const progressIdx = data.progressIndex||0;
  const today = getDailySeed();
  const dayKey = String(today);

  document.getElementById('stat-streak').textContent = recalcStreak(data);
  document.getElementById('stat-total').textContent = totalDone;
  document.getElementById('stat-rate').textContent = totalDone>0 ? Math.round(totalCorrect/totalDone*100)+'%' : '-';
  document.getElementById('corr-count').textContent = correction.length;

  // Show progress: which block of questions is next
  const sub = document.querySelector('.home .sub');
  const startNum = progressIdx + 1;
  const endNum = Math.min(progressIdx + DAILY_COUNT, TOTAL_QUESTIONS);
  const round = Math.floor(progressIdx / TOTAL_QUESTIONS) + 1;
  const roundText = round > 1 ? ` 第${round}轮` : '';
  const missedDays = findMissedDayCount(data);
  if(data.days && data.days[dayKey] && data.days[dayKey].done){
    const d = data.days[dayKey];
    const sessions = d.sessions||1;
    const todayTotal = d.total||DAILY_COUNT;
    const info = missedDays>0 ? ` · 还可补打卡 ${missedDays} 天` : '';
    sub.textContent = `今日已刷 ${sessions} 轮(${todayTotal}题) 正确率 ${Math.round(d.correct/d.total*100)}% · 进度 ${progressIdx}/${TOTAL_QUESTIONS}${roundText}${info}`;
  }else{
    const info = missedDays>0 ? ` · 可补打卡 ${missedDays} 天` : '';
    sub.textContent = `武汉市八年级历史下册真题汇编 · 今日题目：第 ${startNum}–${endNum} 题 / 共 ${TOTAL_QUESTIONS} 题${roundText}${info}`;
  }

  // Streak dots
  const streakRow = document.getElementById('streak-row');
  streakRow.innerHTML = '';
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = dayKeyFromDate(d);
    const dayData = data.days||{};
    const dot = document.createElement('span');
    dot.className = 'streak-dot'+(dayData[ds]?' done':'');
    streakRow.appendChild(dot);
  }

  // Progress bar for overall completion
  const progDiv = document.getElementById('overall-progress');
  if(progDiv){
    const pct = Math.round(progressIdx/TOTAL_QUESTIONS*100);
    progDiv.innerHTML = `<div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${pct}%"></div></div><div style="font-size:10px;color:var(--gray);margin-top:2px">总进度 ${progressIdx}/${TOTAL_QUESTIONS} (${pct}%)</div>`;
  }
}
function findMissedDayCount(data){
  const days = data.days||{};
  const today = new Date();
  let count = 0;
  for(let i=1;i<=30;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = dayKeyFromDate(d);
    if(!days[key] || !days[key].done) count++;
  }
  return count;
}

  const indices = pickDailyQuestions();
  appState = {
    questions: indices,
    currentIdx: 0,
    answers: new Array(DAILY_COUNT).fill(null),
    revealed: new Array(DAILY_COUNT).fill(false),
    mode: 'quiz',
  };
  showPage('quiz');
  renderQuestion();
}

function renderQuestion(){
  const i = appState.currentIdx;
  const q = Q[appState.questions[i]];
  const total = DAILY_COUNT;

  const globalNum = appState.questions[i] + 1;
	  document.getElementById('quiz-progress').textContent = `第 ${globalNum}/138 题 · ${i+1}/${total}`;
  document.getElementById('quiz-topic').textContent = q.t + ' ' + q.u;
  document.getElementById('progress-fill').style.width = ((i)/total*100)+'%';
  document.getElementById('quiz-stem').textContent = q.s;

  const optsDiv = document.getElementById('quiz-options');
  const letters = ['A','B','C','D'];
  const keys = ['a','b','c','d'];
  optsDiv.innerHTML = '';

  const revealed = appState.revealed[i];
  const userAns = appState.answers[i];

  letters.forEach((ltr,idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="letter">${ltr}</span><span>${q[keys[idx]]}</span>`;

    if(revealed){
      if(ltr===q.x) div.classList.add('correct');
      if(ltr===userAns && ltr!==q.x) div.classList.add('wrong');
    }else{
      div.onclick = ()=>selectAnswer(i, ltr);
    }
    optsDiv.appendChild(div);
  });

  // Explanation
  const explDiv = document.getElementById('quiz-explanation');
  const nextDiv = document.getElementById('quiz-next-wrap');
  if(revealed){
    explDiv.className = 'explanation show';
    explDiv.innerHTML = `<strong>正确答案：${q.x}</strong>`;
    const btn = document.createElement('button');
    btn.className = 'quiz-next-btn';
    btn.textContent = i>=total-1 ? '查看结果 →' : '下一题 →';
    btn.onclick = nextQuestion;
    nextDiv.innerHTML = '';
    nextDiv.appendChild(btn);
  }else{
    explDiv.className = 'explanation';
    nextDiv.innerHTML = '';
  }

  document.getElementById('quiz-body').scrollTop = 0;
}

function selectAnswer(qIdx, letter){
  if(appState.revealed[qIdx]) return;
  appState.answers[qIdx] = letter;
  appState.revealed[qIdx] = true;
  renderQuestion();

  // Save progress immediately
  saveCurrentProgress();
}

function nextQuestion(){
  if(appState.currentIdx < DAILY_COUNT-1){
    appState.currentIdx++;
    renderQuestion();
  }else{
    finishQuiz();
  }
}

function saveCurrentProgress(){
  const data = loadData();
  data.totalDone = data.totalDone || 0;
  data.totalCorrect = data.totalCorrect || 0;
  data.days = data.days || {};
  data.correction = data.correction || [];

  const answered = appState.answers.filter(a=>a!==null).length;
  if(answered === DAILY_COUNT){
    const today = getDailySeed();
    // Fill the earliest missed day first, or today if no gaps
    const fillDay = findEarliestUnfilledDay(data);
    const fillKey = String(fillDay || today);

    if(!data.days[fillKey]){
      data.days[fillKey] = {total:0,correct:0};
    }

    for(let i=0;i<DAILY_COUNT;i++){
      const qIdx = appState.questions[i];
      const q = Q[qIdx];
      const userAns = appState.answers[i];
      const isCorrect = userAns === q.x;

      data.totalDone++;
      data.days[fillKey].total = (data.days[fillKey].total||0) + 1;
      if(isCorrect){
        data.totalCorrect++;
        data.days[fillKey].correct = (data.days[fillKey].correct||0) + 1;
      }else{
        const corrEntry = { qIdx: qIdx, userAns: userAns, date: today };
        const exists = data.correction.find(c=>c.qIdx===qIdx);
        if(!exists){
          data.correction.push(corrEntry);
        }
      }
    }

    data.days[fillKey].done = true;
    data.days[fillKey].sessions = (data.days[fillKey].sessions||0) + 1;
    data.lastQuizDate = today;

    // Advance sequential progress
    const prevIdx = data.progressIndex||0;
    data.progressIndex = (prevIdx + DAILY_COUNT) % TOTAL_QUESTIONS;
  }

  saveData(data);
}

function finishQuiz(){
  saveCurrentProgress();

  const correct = appState.answers.filter((a,i)=>a===Q[appState.questions[i]].x).length;
  const total = DAILY_COUNT;

  document.getElementById('result-score').textContent = correct+'/'+total;
  const msgs = {10:'太棒了！全部正确！',9:'非常优秀！',8:'很棒！',7:'不错！',6:'继续加油！',5:'还需努力！',4:'要多复习哦！'};
  document.getElementById('result-msg').textContent = msgs[correct]||'加油！';

  const data = loadData();
  const progIdx = data.progressIndex||0;
  const missedDays = findMissedDayCount(data);
  let detail = `本次正确 ${correct}/${total} 题`;
  detail += ` · 连续打卡 ${recalcStreak(data)} 天`;
  detail += ` · 总进度 ${progIdx}/${TOTAL_QUESTIONS}`;
  if(missedDays>0) detail += ` · 还可补卡 ${missedDays} 天`;
  document.getElementById('result-detail').textContent = detail;

  // Wrong list
  const wrongDiv = document.getElementById('wrong-list');
  wrongDiv.innerHTML = '';
  if(correct < total){
    wrongDiv.innerHTML = '<h4 style="margin-bottom:8px">错题（已加入纠错本）：</h4>';
    for(let i=0;i<DAILY_COUNT;i++){
      if(appState.answers[i]!==Q[appState.questions[i]].x){
        const q = Q[appState.questions[i]];
        wrongDiv.innerHTML += `<div class="item">
          <strong>${q.t}</strong> ${q.s.substring(0,60)}...<br>
          正确答案：${q.x}
        </div>`;
      }
    }
  }
          正确答案：${q.x}. ${answerText}
        </div>`;
      }
    }
  }

  showPage('result');
  updateHomeStats();
}

function continueQuiz(){
  startQuiz();
}

// ========== CORRECTION BOOK ==========
function showCorrection(){
  const data = loadData();
  const correction = data.correction || [];

  document.getElementById('corr-total').textContent = `共${correction.length}题`;
  const listDiv = document.getElementById('correction-list');

  if(correction.length===0){
    listDiv.innerHTML = '<div class="empty-state"><div class="icon">📖</div><p>纠错本为空</p><p style="font-size:12px">做错的题目会自动加入这里，永久保存</p></div>';
  }else{
    listDiv.innerHTML = '';
    // Show newest first
    const sorted = [...correction].reverse();
    const letters = ['A','B','C','D'];
    const keys = ['a','b','c','d'];
    for(const entry of sorted){
      const q = Q[entry.qIdx];
      if(!q) continue;
      const date = String(entry.date);
      const dateStr = date.substring(0,4)+'/'+date.substring(4,6)+'/'+date.substring(6,8);
      const ansIdx = letters.indexOf(q.x);
      const answerText = ansIdx>=0 ? q[keys[ansIdx]] : q.x;
      listDiv.innerHTML += `<div class="correction-item">
        <div class="meta">${q.t} ${q.u} · ${dateStr}</div>
        <div class="q">${q.s}</div>
        <div class="right">✅ 正确答案：${q.x}. ${answerText}</div>
      </div>`;
    }
  }

  showPage('correction');
}

// ========== RESET ==========
function resetData(){
  if(confirm('确定要重置所有数据吗？（包括打卡记录和纠错本）此操作不可恢复！')){
    localStorage.removeItem(STORAGE_KEY);
    goHome();
  }
}

// ========== INIT ==========
function init(){
  updateHomeStats();
  showPage('home');
}

// Support swipe on mobile
let touchStartX = 0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX});
document.addEventListener('touchend',e=>{
  if(appState.mode!=='quiz') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx)>80 && appState.revealed[appState.currentIdx]){
    // Swipe left -> next
    if(dx<-50) nextQuestion();
  }
});

init();

// Register service worker for offline/PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
