<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>道德与法治选择题 · 每日打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="道法打卡">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest-daofa.json">
<meta name="theme-color" content="#1a5276">
<style>
:root{--bg:#f0f4f8;--card:#fff;--primary:#1a5276;--green:#27ae60;--red:#c0392b;--gold:#b8860b;--gray:#999;--tag:#d5e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:8px}
.app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column}
.page{display:none;flex:1;flex-direction:column}
.page.active{display:flex}
.home{justify-content:center;align-items:center;text-align:center;padding:30px 20px}
.home h1{font-size:26px;color:var(--primary);margin-bottom:6px}
.home .sub{font-size:13px;color:var(--gray);margin-bottom:24px}
.stat-row{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border-radius:14px;padding:16px 14px;min-width:80px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:11px;color:var(--gray);margin-top:2px}
.btn{display:inline-block;padding:14px 40px;border-radius:30px;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(26,82,118,.3)}
.btn-primary:active{transform:scale(.96)}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-sm{padding:10px 24px;font-size:14px;border-radius:22px}
.progress-bar{height:3px;background:#d5e0e8;border-radius:2px;margin-bottom:14px}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:.3s}
.quiz-img{display:block;max-width:100%;margin:10px auto;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.quiz-img-caption{text-align:center;font-size:12px;color:#666;margin:8px 0 12px;line-height:1.5}
.quiz-img-fallback{text-align:center;padding:16px 14px;background:#f0f4f8;border-radius:10px;margin:10px 0;border:2px dashed #b0c4de;font-size:13px;color:#4a6a8a;line-height:1.6}
.quiz-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid #eee}
.quiz-header .qnum{font-size:13px;color:var(--gray)}
.quiz-header .topic{font-size:11px;color:var(--gold);background:var(--tag);padding:3px 10px;border-radius:10px}
.quiz-body{flex:1;overflow-y:auto;padding:16px}
.stem{font-size:15px;line-height:1.7;color:#333;margin-bottom:16px;padding:14px;background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;padding:13px 14px;background:var(--card);border-radius:12px;border:2px solid #d5e0e8;cursor:pointer;transition:.2s;font-size:14px;line-height:1.5}
.opt:active{transform:scale(.98)}
.opt.correct{border-color:var(--green);background:#eafaf1}
.opt.wrong{border-color:var(--red);background:#fdeaea}
.opt .letter{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#e8f0f8;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-right:10px;flex-shrink:0}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong .letter{background:var(--red);color:#fff}
.explanation{margin-top:12px;padding:12px;background:#f5f9fd;border-radius:10px;border:1px solid #dde;font-size:13px;color:#666;display:none}
.explanation.show{display:block}
.quiz-nav-wrap{display:flex;gap:10px;margin-top:14px}
.quiz-nav-wrap .single{flex:1}
.quiz-nav-btn{flex:1;display:block;padding:14px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;text-align:center;transition:.2s}
.quiz-next-btn{background:var(--primary);color:#fff;border:none;box-shadow:0 3px 12px rgba(26,82,118,.35)}
.quiz-prev-btn{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.quiz-nav-btn:active{transform:scale(.97)}
.result{justify-content:center;align-items:center;text-align:center;padding:30px 20px}
.result .big-num{font-size:60px;font-weight:800;color:var(--primary)}
.result .big-lbl{font-size:14px;color:var(--gray);margin-bottom:16px}
.result .detail{font-size:13px;color:#555;line-height:2}
.wrong-list{text-align:left;margin-top:16px;max-height:40vh;overflow-y:auto}
.wrong-list .item{font-size:12px;padding:8px;margin:4px 0;background:#fff5f5;border-radius:8px;border-left:3px solid var(--red)}
.correction-header{display:flex;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid #eee;gap:12px}
.correction-header .back{font-size:24px;cursor:pointer;color:var(--primary)}
.correction-list{flex:1;overflow-y:auto;padding:12px}
.correction-item{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.correction-item .meta{font-size:11px;color:var(--gold);margin-bottom:6px}
.correction-item .q{font-size:13px;line-height:1.6;margin-bottom:8px}
.correction-item .right{font-size:12px;color:var(--green)}
.correction-item .streak{font-size:11px;color:var(--gold);margin-top:4px}
.btn-practice{background:var(--gold);color:#fff;border:none;padding:6px 14px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-practice:active{transform:scale(.96)}
.correction-quiz-badge{font-size:11px;color:#fff;background:var(--gold);padding:3px 10px;border-radius:10px}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.streak-row{display:flex;gap:4px;justify-content:center;margin-bottom:12px}
.streak-dot{width:8px;height:8px;border-radius:50%;background:#d5e0e8}
.streak-dot.done{background:var(--primary)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="page active" id="page-home">
    <div class="home">
      <h1>道德与法治选择题 · 每日打卡</h1>
      <div class="sub">武汉市八年级道法下册真题汇编</div>
      <div class="stat-row">
        <div class="stat-card"><div class="num" id="stat-streak">0</div><div class="lbl">连续打卡(天)</div></div>
        <div class="stat-card"><div class="num" id="stat-total">0</div><div class="lbl">累计做题</div></div>
        <div class="stat-card"><div class="num" id="stat-rate">-</div><div class="lbl">正确率</div></div>
      </div>
      <div class="streak-row" id="streak-row"></div>
      <div id="overall-progress"></div>
      <div style="margin-bottom:16px"><button class="btn btn-primary" onclick="startQuiz()">开始刷题 (10题/轮)</button></div>
      <div><button class="btn btn-outline btn-sm" onclick="showCorrection()">纠错本 (<span id="corr-count">0</span>)</button></div>
<div style="margin-top:12px"><button class="btn btn-outline btn-sm" style="font-size:12px;padding:8px 16px" onclick="document.getElementById('import-file').click()">导入备份</button>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
    </div>
  </div>

  <div class="page" id="page-quiz">
    <div class="quiz-header">
      <span class="qnum" id="quiz-progress"></span>
      <span class="topic" id="quiz-topic"></span>
    </div>
    <div style="padding:0 16px"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div></div>
    <div class="quiz-body" id="quiz-body">
      <div class="stem" id="quiz-stem"></div>
      <div id="quiz-image" style="display:none"></div>
      <div class="options" id="quiz-options"></div>
      <div class="explanation" id="quiz-explanation"></div>
      <div id="quiz-next-wrap"></div>
    </div>
  </div>

  <div class="page" id="page-result">
    <div class="result">
      <div class="big-num" id="result-score"></div>
      <div class="big-lbl" id="result-msg"></div>
      <div class="detail" id="result-detail"></div>
      <div class="wrong-list" id="wrong-list"></div>
      <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary btn-sm" onclick="continueQuiz()">继续刷10题</button>
        <button class="btn btn-outline btn-sm" onclick="goHome()">返回首页</button>
        <button class="btn btn-outline btn-sm" style="background:#fffbe6;border-color:#d4a017;color:#8b6914" onclick="exportData()">💾 保存备份</button>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--gray)">建议点击保存备份，防止清浏览器后数据丢失</div>
    </div>
  </div>

  <div class="page" id="page-correction">
    <div class="correction-header">
      <span class="back" onclick="goHome()">←</span>
      <span style="font-weight:700;color:var(--primary)">纠错本</span>
      <button class="btn-practice" id="btn-practice" style="display:none" onclick="startCorrectionQuiz()">重新练习错题</button>
      <span style="font-size:12px;color:var(--gray);margin-left:auto" id="corr-total">共0题</span>
    </div>
    <div class="correction-list" id="correction-list"></div>
  </div>
</div>

<script>
// ========== DATA ==========
const Q = [
{u:"第一单元",t:"1-1 党的主张与人民意志",s:"2023年GDP超126万亿等成就，说明中国特色社会主义制度的最大优势是（ ）",a:"中国共产党领导",b:"坚持人民当家作主",c:"实行民主集中制",d:"坚持民族区域自治",x:"A",tp:"党的主张和人民意志的统一",src:"江岸23-24期末"},
{u:"第一单元",t:"1-1 党的主张与人民意志",s:"习近平总书记在2024年新年贺词中强调'让老百姓过上更好的日子'，这表明（ ）",a:"我国宪法是党和人民意志的集中体现",b:"党的根本宗旨是全心全意为人民服务",c:"党科学立法、严格执法、支持司法、带头守法",d:"党和政府致力于满足全体人民群众的所有需求",x:"B",tp:"党的主张和人民意志的统一",src:"江岸23-24期末"},
{u:"第一单元",t:"1-1 党的主张与人民意志",s:"下列古语最能体现中国共产党根本宗旨的是（ ）①天下兴亡，匹夫有责 ②治国有常，利民为本 ③从善如登，从恶如崩 ④我将无我，不负人民",a:"①②",b:"①③",c:"②④",d:"③④",x:"C",tp:"党的主张和人民意志的统一",src:"江岸23-24期末"},
{u:"第一单元",t:"1-1 党的主张与人民意志",s:"中国共产党领导人民制定宪法，这体现了（ ）",a:"国家权力属于人民",b:"我国宪法是党的主张和人民意志的统一",c:"人民拥有广泛的权利",d:"国家权力须在宪法和法律范围内行使",x:"B",tp:"党的主张和人民意志的统一",src:"江岸23-24期末"},

{u:"第一单元",t:"1-2 治国安邦总章程",s:"国家医保局将7种罕见病用药新增入医保，体现了（ ）",a:"我国是人民民主专政的社会主义国家",b:"公民享有广泛的政治权利",c:"政府坚持依法行政",d:"宪法是国家的根本法",x:"A",tp:"治国安邦的总章程",src:"武昌23-24期中"},
{u:"第一单元",t:"1-2 治国安邦总章程",s:"武汉市十四届人大一次会议选举产生的国家机关工作人员进行宪法宣誓活动，开展此活动是因为（ ）",a:"宪法规定了国家生活中的根本问题",b:"宪法规定了公民的基本权利和基本义务",c:"宪法是其他法律的立法基础和立法依据",d:"宪法是我国的根本法，是一切组织和个人的根本活动准则",x:"D",tp:"治国安邦的总章程",src:"武昌23-24期中"},

{u:"第一单元",t:"1-3 坚持依宪治国",s:"十四届全国人大一次会议修改立法法，对合宪性审查作出明确规定，旨在（ ）①完备制度措施，维护宪法权威 ②健全法治体系，打造阳光政府 ③弘扬宪法精神，建设法治中国 ④规范权力，完善法律实施机制",a:"①③",b:"①④",c:"②③",d:"②④",x:"A",tp:"坚持依宪治国",src:"江汉22-23期末"},

const UNIT_ORDER = ["第一单元", "第二单元", "第三单元", "第四单元"];

const STORAGE_KEY = 'daofa_quiz_data';
const DAILY_COUNT = 10;
const TOTAL_QUESTIONS = Q.length;

// ========== STATE ==========
function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}
let appState = {questions:[],currentIdx:0,answers:[],revealed:[],mode:'home',quizMode:'normal'};

// ========== NAVIGATION ==========
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+name);
  if(page)page.classList.add('active');
  appState.mode=name;
  window.scrollTo(0,0);
}
function goHome(){showPage('home');updateHomeStats();}

// ========== HELPERS ==========
function getDailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function dayKeyFromDate(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function recalcStreak(data){
  const days=data.days||{};let streak=0;const today=new Date();
  for(let i=0;i<365;i++){const d=new Date(today);d.setDate(d.getDate()-i);const key=dayKeyFromDate(d);if(days[key]&&days[key].done)streak++;else break;}
  return streak;
}
function findEarliestUnfilledDay(data){
  const days=data.days||{};const today=new Date();
  for(let i=1;i<=30;i++){const d=new Date(today);d.setDate(d.getDate()-i);const key=dayKeyFromDate(d);if(!days[key]||!days[key].done)return key;}
  return null;
}
function findMissedDayCount(data){
  const days=data.days||{};const today=new Date();let count=0;
  for(let i=1;i<=30;i++){const d=new Date(today);d.setDate(d.getDate()-i);const key=dayKeyFromDate(d);if(!days[key]||!days[key].done)count++;}
  return count;
}

function updateHomeStats(){
  const data=loadData();
  const totalDone=data.totalDone||0,totalCorrect=data.totalCorrect||0,correction=data.correction||[],progressIdx=data.progressIndex||0;
  const today=getDailySeed(),dayKey=String(today);
  document.getElementById('stat-streak').textContent=recalcStreak(data);
  document.getElementById('stat-total').textContent=totalDone;
  document.getElementById('stat-rate').textContent=totalDone>0?Math.round(totalCorrect/totalDone*100)+'%':'-';
  document.getElementById('corr-count').textContent=correction.length;
  const sub=document.querySelector('.home .sub');
  const startNum=progressIdx+1,endNum=Math.min(progressIdx+DAILY_COUNT,TOTAL_QUESTIONS);
  const round=Math.floor(progressIdx/TOTAL_QUESTIONS)+1;
  const roundText=round>1?' 第'+round+'轮':'';
  const missedDays=findMissedDayCount(data);
  if(data.days&&data.days[dayKey]&&data.days[dayKey].done){
    const d=data.days[dayKey],sessions=d.sessions||1,todayTotal=d.total||DAILY_COUNT;
    const info=missedDays>0?' · 还可补打卡 '+missedDays+' 天':'';
    sub.textContent='今日已刷 '+sessions+' 轮('+todayTotal+'题) 正确率 '+Math.round(d.correct/d.total*100)+'% · 进度 '+progressIdx+'/'+TOTAL_QUESTIONS+roundText+info;
  }else{
    const info=missedDays>0?' · 可补打卡 '+missedDays+' 天':'';
    sub.textContent='武汉市八年级道法下册真题汇编 · 进度 '+progressIdx+'/'+TOTAL_QUESTIONS+roundText+info;
  }
  const streakRow=document.getElementById('streak-row');streakRow.innerHTML='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const ds=dayKeyFromDate(d);
    const dayData=data.days||{};const dot=document.createElement('span');
    dot.className='streak-dot'+(dayData[ds]?' done':'');streakRow.appendChild(dot);
  }
  const progDiv=document.getElementById('overall-progress');
  if(progDiv){const pct=Math.round(progressIdx/TOTAL_QUESTIONS*100);
    progDiv.innerHTML='<div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:'+pct+'%"></div></div><div style="font-size:10px;color:var(--gray);margin-top:2px">总进度 '+progressIdx+'/'+TOTAL_QUESTIONS+' ('+pct+'%)</div>';
  }
}

// ========== QUIZ ==========
function getProgressIndex(){const data=loadData();return data.progressIndex||0;}
function startQuiz(){
  const start=getProgressIndex(),indices=[];
  for(let i=0;i<DAILY_COUNT;i++)indices.push((start+i)%TOTAL_QUESTIONS);
  appState={questions:indices,currentIdx:0,answers:new Array(DAILY_COUNT).fill(null),revealed:new Array(DAILY_COUNT).fill(false),mode:'quiz',quizMode:'normal'};
  showPage('quiz');renderQuestion();
}
function renderQuestion(){
  const i=appState.currentIdx,q=Q[appState.questions[i]],total=appState.questions.length;
  const globalNum=appState.questions[i]+1;
  if(appState.quizMode==='correction'){
    document.getElementById('quiz-progress').textContent='错题 '+(i+1)+'/'+total;
    document.getElementById('quiz-topic').innerHTML='<span class="correction-quiz-badge">🔁 纠错复习</span>';
  }else{
    document.getElementById('quiz-progress').textContent='第 '+globalNum+'/'+TOTAL_QUESTIONS+' 题 · '+(i+1)+'/'+total;
    document.getElementById('quiz-topic').textContent=q.t+' '+q.u;
  }
  document.getElementById('progress-fill').style.width=((i)/total*100)+'%';
  document.getElementById('quiz-stem').textContent=q.s;
  const imgDiv=document.getElementById('quiz-image');
  if(q.img){
    var altText=q.alt||'参考图示';
    imgDiv.innerHTML='<img class="quiz-img" src="./images_daofa/'+q.img+'" alt="'+altText+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div class="quiz-img-fallback" style="display:none">[图片加载失败]<br>'+altText+'</div><div class="quiz-img-caption">'+altText+'</div>';
    imgDiv.style.display='block';
  }
  else if(q.alt){
    imgDiv.innerHTML='<div style="padding:14px;background:#f8fafc;border-radius:10px;margin:10px 0;border:2px solid #b0c4de;font-size:13px;color:#4a6a8a;line-height:1.6;text-align:center">[图片说明] '+q.alt+'</div>';
    imgDiv.style.display='block';
  }
  else{imgDiv.innerHTML='';imgDiv.style.display='none';}
  const optsDiv=document.getElementById('quiz-options');
  const letters=['A','B','C','D'],keys=['a','b','c','d'];
  optsDiv.innerHTML='';
  const revealed=appState.revealed[i],userAns=appState.answers[i];
  letters.forEach((ltr,idx)=>{
    const div=document.createElement('div');div.className='opt';
    div.innerHTML='<span class="letter">'+ltr+'</span><span>'+q[keys[idx]]+'</span>';
    if(revealed){
      if(ltr===q.x)div.classList.add('correct');
      if(ltr===userAns&&ltr!==q.x)div.classList.add('wrong');
    }else{div.onclick=()=>selectAnswer(i,ltr);}
    optsDiv.appendChild(div);
  });
  const explDiv=document.getElementById('quiz-explanation'),nextDiv=document.getElementById('quiz-next-wrap');
  if(revealed){
    explDiv.className='explanation show';
    explDiv.innerHTML='<strong>'+q.x+'</strong>　<span style="color:#c0392b;font-weight:700">[知识点] '+q.t+' '+(q.tp||'')+'</span>　[来源] '+(q.src||'');
    nextDiv.innerHTML='';
    const wrap=document.createElement('div');wrap.className='quiz-nav-wrap';
    if(i>0){
      const prevBtn=document.createElement('button');
      prevBtn.className='quiz-nav-btn quiz-prev-btn';prevBtn.textContent='← 上一题';
      prevBtn.onclick=prevQuestion;wrap.appendChild(prevBtn);
    }
    const nextBtn=document.createElement('button');
    nextBtn.className='quiz-nav-btn quiz-next-btn';
    if(i===0)nextBtn.classList.add('single');
    nextBtn.textContent=i>=total-1?'查看结果 →':'下一题 →';
    nextBtn.onclick=nextQuestion;wrap.appendChild(nextBtn);nextDiv.appendChild(wrap);
  }else{explDiv.className='explanation';nextDiv.innerHTML='';}
  document.getElementById('quiz-body').scrollTop=0;
}
function selectAnswer(qIdx,letter){
  if(appState.revealed[qIdx])return;appState.answers[qIdx]=letter;appState.revealed[qIdx]=true;
  renderQuestion();
}
function nextQuestion(){
  if(appState.currentIdx<appState.questions.length-1){appState.currentIdx++;renderQuestion();}else{finishQuiz();}
}
function prevQuestion(){if(appState.currentIdx>0){appState.currentIdx--;renderQuestion();}}
function saveCurrentProgress(){
  const data=loadData();
  data.totalDone=data.totalDone||0;data.totalCorrect=data.totalCorrect||0;
  data.days=data.days||{};data.correction=data.correction||[];
  const answered=appState.answers.filter(a=>a!==null).length;
  if(answered===DAILY_COUNT||(appState.quizMode==='correction'&&answered===appState.questions.length)){
    const today=getDailySeed();
    if(appState.quizMode==='correction'){
      let removed=0;
      for(let i=0;i<appState.questions.length;i++){
        const qIdx=appState.questions[i],q=Q[qIdx],userAns=appState.answers[i],isCorrect=userAns===q.x;
        data.totalDone++;
        if(isCorrect)data.totalCorrect++;
        const entry=data.correction.find(c=>c.qIdx===qIdx);
        if(entry){
          entry.correctStreak=entry.correctStreak||0;
          if(isCorrect){
            if(entry.lastCorrectDate!==today){
              entry.correctStreak++;
              entry.lastCorrectDate=today;
            }
            if(entry.correctStreak>=7){data.correction=data.correction.filter(c=>c.qIdx!==qIdx);removed++;}
          }else{entry.correctStreak=0;entry.lastCorrectDate=null;}
        }
      }
      data._lastCorrectionRemoved=removed;
    }else{
      const fillDay=findEarliestUnfilledDay(data),fillKey=String(fillDay||today);
      if(!data.days[fillKey])data.days[fillKey]={total:0,correct:0};
      for(let i=0;i<DAILY_COUNT;i++){
        const qIdx=appState.questions[i],q=Q[qIdx],userAns=appState.answers[i],isCorrect=userAns===q.x;
        data.totalDone++;data.days[fillKey].total=(data.days[fillKey].total||0)+1;
        if(isCorrect){data.totalCorrect++;data.days[fillKey].correct=(data.days[fillKey].correct||0)+1;}
        else{const corrEntry={qIdx:qIdx,userAns:userAns,date:today,correctStreak:0,lastCorrectDate:null};const exists=data.correction.find(c=>c.qIdx===qIdx);if(!exists)data.correction.push(corrEntry);}
      }
      data.days[fillKey].done=true;data.days[fillKey].sessions=(data.days[fillKey].sessions||0)+1;
      data.lastQuizDate=today;
      const prevIdx=data.progressIndex||0;data.progressIndex=(prevIdx+DAILY_COUNT)%TOTAL_QUESTIONS;
    }
  }
  saveData(data);
}
function finishQuiz(){
  saveCurrentProgress();
  const total=appState.quizMode==='correction'?appState.questions.length:DAILY_COUNT;
  const correct=appState.answers.filter((a,i)=>a===Q[appState.questions[i]].x).length;
  if(appState.quizMode==='correction'){
    document.getElementById('result-score').textContent=correct+'/'+total;
    document.getElementById('result-msg').textContent=correct===total?'错题全部答对！':'继续加油！';
    const data=loadData();const removed=data._lastCorrectionRemoved||0;delete data._lastCorrectionRemoved;saveData(data);
    const remaining=(data.correction||[]).length;
    let detail='本次正确 '+correct+'/'+total+' 题';
    if(removed>0)detail+=' · 🎉 移除了 '+removed+' 题（达到7天连续正确）';
    detail+=' · 纠错本剩余 '+remaining+' 题';
    document.getElementById('result-detail').textContent=detail;
    const wrongDiv=document.getElementById('wrong-list');wrongDiv.innerHTML='';
    if(correct<total){
      wrongDiv.innerHTML='<h4 style="margin-bottom:8px">错题（连续正确天数已重置）：</h4>';
      for(let i=0;i<total;i++){
        if(appState.answers[i]!==Q[appState.questions[i]].x){
          const q=Q[appState.questions[i]];
          wrongDiv.innerHTML+='<div class="item"><strong>'+q.t+'</strong> '+q.s.substring(0,60)+'...<br>正确答案：'+q.x+'</div>';
        }
      }
    }
    const btnArea=document.querySelector('#page-result .result > div[style]');
    if(btnArea)btnArea.innerHTML=remaining>0?'<button class="btn btn-primary btn-sm" onclick="startCorrectionQuiz()">继续复习错题</button><button class="btn btn-outline btn-sm" onclick="goHome()">返回首页</button>':'<button class="btn btn-primary btn-sm" onclick="goHome()">返回首页</button>';
  }else{
    document.getElementById('result-score').textContent=correct+'/'+total;
    const msgs={10:'太棒了！全部正确！',9:'非常优秀！',8:'很棒！',7:'不错！',6:'继续加油！',5:'还需努力！',4:'要多复习哦！'};
    document.getElementById('result-msg').textContent=msgs[correct]||'加油！';
    const data=loadData(),progIdx=data.progressIndex||0,missedDays=findMissedDayCount(data);
    let detail='本次正确 '+correct+'/'+total+' 题';
    detail+=' · 连续打卡 '+recalcStreak(data)+' 天 · 总进度 '+progIdx+'/'+TOTAL_QUESTIONS;
    if(missedDays>0)detail+=' · 还可补卡 '+missedDays+' 天';
    document.getElementById('result-detail').textContent=detail;
    const wrongDiv=document.getElementById('wrong-list');wrongDiv.innerHTML='';
    if(correct<total){
      wrongDiv.innerHTML='<h4 style="margin-bottom:8px">错题（已加入纠错本）：</h4>';
      for(let i=0;i<total;i++){
        if(appState.answers[i]!==Q[appState.questions[i]].x){
          const q=Q[appState.questions[i]];
          wrongDiv.innerHTML+='<div class="item"><strong>'+q.t+'</strong> '+q.s.substring(0,60)+'...<br>正确答案：'+q.x+'</div>';
        }
      }
    }
    const btnArea=document.querySelector('#page-result .result > div[style]');
    if(btnArea)btnArea.innerHTML='<button class="btn btn-primary btn-sm" onclick="continueQuiz()">继续刷10题</button><button class="btn btn-outline btn-sm" onclick="goHome()">返回首页</button><button class="btn btn-outline btn-sm" style="background:#fffbe6;border-color:#d4a017;color:#8b6914" onclick="exportData()">💾 保存备份</button>';
  }
  showPage('result');updateHomeStats();
}
function continueQuiz(){startQuiz();}

// ========== CORRECTION BOOK ==========
function maintainCorrectionStreaks(data){
  const correction=data.correction||[];if(!correction.length)return;
  const today=getDailySeed();
  const yesterday=(()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKeyFromDate(d);})();
  let changed=false;
  for(const entry of correction){
    if(entry.lastCorrectDate&&entry.lastCorrectDate!==today&&entry.lastCorrectDate!==yesterday){entry.correctStreak=0;entry.lastCorrectDate=null;changed=true;}
    if(entry.correctStreak===undefined)entry.correctStreak=0;
    if(entry.lastCorrectDate===undefined)entry.lastCorrectDate=null;
  }
  return changed;
}
function startCorrectionQuiz(){
  const data=loadData();
  maintainCorrectionStreaks(data);
  const correction=data.correction||[];
  if(correction.length===0){alert('纠错本为空，没有需要复习的题目！');return;}
  const sorted=[...correction].sort((a,b)=>(a.correctStreak||0)-(b.correctStreak||0));
  const pick=sorted.slice(0,Math.min(10,sorted.length));
  const indices=pick.map(e=>e.qIdx);
  appState={questions:indices,currentIdx:0,answers:new Array(indices.length).fill(null),revealed:new Array(indices.length).fill(false),mode:'quiz',quizMode:'correction'};
  showPage('quiz');renderQuestion();
}
function showCorrection(){
  const data=loadData();
  maintainCorrectionStreaks(data);
  saveData(data);
  const correction=data.correction||[];
  document.getElementById('corr-total').textContent='共'+correction.length+'题';
  const btnPractice=document.getElementById('btn-practice');
  btnPractice.style.display=correction.length>0?'':'none';
  const listDiv=document.getElementById('correction-list');
  if(correction.length===0){
    listDiv.innerHTML='<div class="empty-state"><div class="icon">📖</div><p>纠错本为空</p><p style="font-size:12px">连续7天答对的错题会自动移除，加油！</p></div>';
  }else{
    listDiv.innerHTML='';const sorted=[...correction].reverse();
    for(const entry of sorted){
      const q=Q[entry.qIdx];if(!q)continue;
      const date=String(entry.date),dateStr=date.substring(0,4)+'/'+date.substring(4,6)+'/'+date.substring(6,8);
      const ansText=q.x==='A'?q.a:q.x==='B'?q.b:q.x==='C'?q.c:q.d;
      const streak=entry.correctStreak||0;
      const streakHtml=streak>0?'<div class="streak">🔥 连续正确 '+streak+'/7 天</div>':'<div class="streak" style="color:var(--gray)">还需连续正确 7 天</div>';
      listDiv.innerHTML+='<div class="correction-item"><div class="meta">'+q.t+' '+q.u+' · '+dateStr+'</div><div class="q">'+q.s+'</div><div class="right">✅ 正确答案：'+q.x+'. '+ansText+'</div>'+streakHtml+'</div>';
    }
  }
  showPage('correction');
}

// ========== EXPORT/IMPORT ==========
function exportData(){
  const data=loadData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  const now=new Date();const ds=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0');
  a.href=url;a.download='daofa-quiz-backup-'+ds+'.json';a.click();URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  if(!confirm('导入将覆盖当前所有打卡记录和纠错本数据，确定继续？')){e.target.value='';return;}
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(typeof data.totalDone!=='number')throw new Error('格式错误');
      saveData(data);alert('数据导入成功！');goHome();
    }catch(err){alert('文件格式不正确，导入失败');}
  };
  reader.readAsText(file);e.target.value='';
}

// ========== INIT ==========
function init(){const data=loadData();if(maintainCorrectionStreaks(data))saveData(data);updateHomeStats();showPage('home');}
let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX});
document.addEventListener('touchend',e=>{
  if(appState.mode!=='quiz')return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>80&&appState.revealed[appState.currentIdx]){if(dx<-50)nextQuestion();else if(dx>50)prevQuestion();}
});
init();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});}
</script>
